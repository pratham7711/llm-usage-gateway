server:
  port: 8080
  tomcat:
    threads:
      max: 400
    max-connections: 20000
    accept-count: 1000

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 150s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/usage}
    username: ${DB_USER:usage}
    password: ${DB_PASSWORD:usage}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce's default is 60 s, and while disconnected it queues commands for the reconnect,
      # so a Redis outage held every request (and its in-flight permit) for a minute.
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 5
        batch.size: 65536
        delivery.timeout.ms: 120000
        request.timeout.ms: 15000
        max.block.ms: 5000

gateway:
  upstream-base-url: ${UPSTREAM_BASE_URL:http://localhost:8090}
  upstream-api-key: ${UPSTREAM_API_KEY:}
  upstream-connect-timeout: 2s
  upstream-request-timeout: 120s
  usage-topic-partitions: ${USAGE_TOPIC_PARTITIONS:6}
  usage-topic-replicas: ${USAGE_TOPIC_REPLICAS:1}
  # 0 = 128 per available CPU (see InFlightLimitFilter)
  max-in-flight: ${MAX_IN_FLIGHT:0}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: gateway
