server:
  port: 8080
  tomcat:
    threads:
      max: 400
    max-connections: 20000
    accept-count: 1000

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # Must outlast gateway.max-stream-duration, or a long stream is cut for the client while the
      # gateway goes on draining (and billing) it.
      request-timeout: ${ASYNC_REQUEST_TIMEOUT:11m}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/usage}
    username: ${DB_USER:usage}
    password: ${DB_PASSWORD:usage}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce's default is 60 s, and while disconnected it queues commands for the reconnect,
      # so a Redis outage held every request (and its in-flight permit) for a minute.
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 5
        batch.size: 65536
        delivery.timeout.ms: 120000
        request.timeout.ms: 15000
        max.block.ms: 5000

gateway:
  upstream-base-url: ${UPSTREAM_BASE_URL:http://localhost:8090}
  upstream-api-key: ${UPSTREAM_API_KEY:}
  upstream-connect-timeout: 2s
  upstream-request-timeout: ${UPSTREAM_REQUEST_TIMEOUT:120s}
  max-stream-duration: ${MAX_STREAM_DURATION:10m}
  # Must exceed the longest request by 30s (checked at startup); a crashed gateway's reservations
  # are freed, and billed, this long after admission.
  lease-ttl: ${LEASE_TTL:11m}
  default-max-output-tokens: ${DEFAULT_MAX_OUTPUT_TOKENS:4096}
  prompt-estimate-margin: 0.10
  estimate-sample-rate: ${ESTIMATE_SAMPLE_RATE:0.01}
  max-open-leases-per-tenant: ${MAX_OPEN_LEASES_PER_TENANT:100000}
  usage-topic-partitions: ${USAGE_TOPIC_PARTITIONS:6}
  usage-topic-replicas: ${USAGE_TOPIC_REPLICAS:1}
  # 0 = 128 per available CPU (see InFlightLimitFilter)
  max-in-flight: ${MAX_IN_FLIGHT:0}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: gateway
