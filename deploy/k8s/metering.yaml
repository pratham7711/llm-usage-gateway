# Two replicas share the consumer group; Kafka assigns each a subset of the 6 partitions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metering
spec:
  replicas: 2
  selector: { matchLabels: { app: metering } }
  template:
    metadata: { labels: { app: metering } }
    spec:
      enableServiceLinks: false
      containers:
        - name: metering
          image: llmgw/metering:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: llmgw-config }
            - secretRef: { name: llmgw-db }
          env:
            - { name: METERING_CONCURRENCY, value: "3" }
          ports: [{ containerPort: 8081 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
