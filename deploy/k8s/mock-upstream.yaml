apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-upstream
spec:
  replicas: 1
  selector: { matchLabels: { app: mock-upstream } }
  template:
    metadata: { labels: { app: mock-upstream } }
    spec:
      enableServiceLinks: false
      containers:
        - name: mock-upstream
          image: llmgw/mock-upstream:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8090 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8090 }
            periodSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mock-upstream
spec:
  selector: { app: mock-upstream }
  ports: [{ port: 8090, targetPort: 8090 }]
