name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and Testcontainers integration tests (Postgres, Kafka, Redis)
        run: mvn -B verify

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build images and start the stack
        run: make up
      - name: Short k6 run, then reconcile billed events against successful responses
        run: |
          mkdir -p results/raw
          RATES=300 python3 loadtest/bench.py smoke
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color gateway metering | tail -n 300
